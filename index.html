<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Granja — Control diario</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7EF;
    --card:#FFFFFF;
    --border:#E5D9C2;
    --ink:#2A2118;
    --ink-soft:#6B5E4C;
    --yolk:#E3A73A;
    --yolk-dark:#C98E22;
    --green:#3F6B4A;
    --green-soft:#E7EFE7;
    --rust:#B3462F;
    --rust-soft:#FBEAE6;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:82px;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  /* ---------- LOGIN ---------- */
  #login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:22px;text-align:center;}
  #login-screen .egg{font-size:56px;}
  #login-screen h1{font-size:28px;}
  #login-screen p{color:var(--ink-soft);margin:0;font-size:15px;}
  #login-screen input{width:100%;max-width:280px;padding:16px;font-size:18px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);text-align:center;letter-spacing:2px;}
  #login-screen input:focus{outline:none;border-color:var(--yolk);}
  #login-screen button{width:100%;max-width:280px;padding:16px;font-size:17px;font-weight:600;border:none;border-radius:var(--radius);background:var(--yolk);color:#fff;}
  #login-error{color:var(--rust);font-size:14px;height:18px;}

  /* ---------- HEADER ---------- */
  header.topbar{padding:22px 20px 16px;}
  header.topbar .greet{color:var(--ink-soft);font-size:14px;margin-bottom:2px;}
  header.topbar h1{font-size:26px;}

  /* ---------- NAV ---------- */
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);max-width:480px;margin:0 auto;display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20;}
  nav.tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 1px;border-radius:10px;color:var(--ink-soft);font-size:9.5px;font-weight:600;}
  nav.tabbar button .ic{font-size:18px;}
  nav.tabbar button.active{color:var(--yolk-dark);background:#FDF3E0;}

  /* ---------- LAYOUT HELPERS ---------- */
  main{flex:1;padding:0 20px 24px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .row{display:flex;gap:12px;}
  .row > *{flex:1;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .stat .label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .stat .value{font-family:'Fraunces',serif;font-size:24px;font-weight:600;margin-top:4px;}
  .stat.pos .value{color:var(--green);}
  .stat.neg .value{color:var(--rust);}
  .section-title{font-size:15px;font-weight:700;color:var(--ink-soft);margin:22px 0 10px;text-transform:uppercase;letter-spacing:.03em;}
  .section-title:first-child{margin-top:0;}

  label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  input[type=text],input[type=number],input[type=date],select,textarea{
    width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);margin-bottom:14px;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--yolk);}
  .field{margin-bottom:0;}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;background:var(--yolk);color:#fff;}
  .btn:active{background:var(--yolk-dark);}
  .btn.secondary{background:var(--green-soft);color:var(--green);}
  .btn.ghost{background:none;border:1.5px solid var(--border);color:var(--ink-soft);}
  .btn.danger{background:var(--rust-soft);color:var(--rust);}
  .toggle-group{display:flex;gap:8px;margin-bottom:14px;}
  .toggle-group button{flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-weight:600;font-size:14px;color:var(--ink-soft);}
  .toggle-group button.selected{border-color:var(--yolk);background:#FDF3E0;color:var(--yolk-dark);}

  .list-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);gap:10px;}
  .list-item:last-child{border-bottom:none;}
  .list-item .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .list-item .amount{font-weight:700;font-family:'Fraunces',serif;font-size:16px;white-space:nowrap;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.paid{background:var(--green-soft);color:var(--green);}
  .badge.debt{background:var(--rust-soft);color:var(--rust);}
  .empty{color:var(--ink-soft);font-size:14px;text-align:center;padding:20px 0;}
  .del-x{background:none;border:none;color:var(--ink-soft);font-size:18px;padding:4px 6px;}

  .fab-add{position:fixed;bottom:96px;right:calc(50% - 240px + 20px);width:56px;height:56px;border-radius:50%;background:var(--yolk);color:#fff;border:none;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:15;}
  @media (max-width:520px){.fab-add{right:20px;}}

  .modal-bg{position:fixed;inset:0;background:rgba(42,33,24,.45);display:flex;align-items:flex-end;z-index:30;}
  .modal{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
  .modal h2{font-size:20px;margin-bottom:16px;}
  .modal-close{position:absolute;top:16px;right:20px;background:none;border:none;font-size:22px;color:var(--ink-soft);}

  .period-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .period-tabs button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .period-tabs button.selected{background:var(--ink);color:#fff;border-color:var(--ink);}
</style>
</head>
<body>

<div id="login-screen">
  <div class="egg">🥚</div>
  <h1>Control de la Granja</h1>
  <p>Ingresa la contraseña familiar para entrar</p>
  <input type="password" id="login-input" placeholder="Contraseña" autocomplete="off">
  <div id="login-error"></div>
  <button onclick="tryLogin()">Entrar</button>
</div>

<div id="app" style="display:none;">
  <header class="topbar">
    <div class="greet" id="today-label"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h1 id="page-title">Inicio</h1>
      <div style="display:flex;gap:8px;">
        <button onclick="downloadBackup(this)" title="Descargar respaldo" style="background:none;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-size:16px;color:var(--ink-soft);">📥</button>
        <button onclick="openPricesModal()" title="Precios" style="background:none;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-size:16px;color:var(--ink-soft);">⚙️</button>
      </div>
    </div>
  </header>
  <main id="main-content"></main>

  <nav class="tabbar">
    <button data-view="dashboard" onclick="setView('dashboard')"><span class="ic">🏠</span>Inicio</button>
    <button data-view="production" onclick="setView('production')"><span class="ic">🥚</span>Producción</button>
    <button data-view="sales" onclick="setView('sales')"><span class="ic">🧾</span>Ventas</button>
    <button data-view="clients" onclick="setView('clients')"><span class="ic">👥</span>Clientes</button>
    <button data-view="expenses" onclick="setView('expenses')"><span class="ic">💸</span>Gastos</button>
    <button data-view="analysis" onclick="setView('analysis')"><span class="ic">📊</span>Análisis</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ============ CONFIGURACIÓN ============ */
const SUPABASE_URL = "https://jumtjdpqtnulibgkoufk.supabase.co";
const SUPABASE_KEY = "sb_publishable_KrpzNGnHshh2J0NowUg_ug_A_UKVijQ";
const APP_PASSWORD = "granja2026"; // <-- cámbiala aquí cuando quieras

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SIZES = [
  {v:'chico', l:'Chico'},
  {v:'mediano', l:'Mediano'},
  {v:'grande', l:'Grande'},
  {v:'extra_grande', l:'Extra grande'}
];
const sizeLabel = v => (SIZES.find(s=>s.v===v)||{}).l || v;
const unidadLabel = u => u==='caja' ? 'caja(s)' : u==='unidad' ? 'huevo(s)' : 'cartón(es)';

const money = n => new Intl.NumberFormat('es-GT', {style:'currency', currency:'GTQ'}).format(n||0);
// IMPORTANTE: usamos la fecha LOCAL del dispositivo, nunca toISOString() (esa da la fecha en UTC/Inglaterra,
// lo que en Guatemala se adelanta un día después de las 6pm).
function localISO(d){
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const todayISO = () => localISO(new Date());
const fmtDate = d => new Date(d+'T00:00:00').toLocaleDateString('es-GT', {day:'2-digit', month:'short'});

let state = { view: 'dashboard', prices: [], clients: [] };

async function withSaving(btn, fn){
  const original = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
  try{
    await fn();
  } catch(err){
    console.error(err);
    alert('No se pudo guardar.\n\nError: ' + (err && (err.message || err.details) || 'desconocido') + '\n\nRevisa tu conexión a internet e inténtalo de nuevo.');
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = original; }
  }
}

/* ============ LOGIN ============ */
function tryLogin(){
  const val = document.getElementById('login-input').value;
  if(val === APP_PASSWORD){
    sessionStorage.setItem('granja_auth','1');
    boot();
  } else {
    document.getElementById('login-error').textContent = 'Contraseña incorrecta';
  }
}
document.getElementById('login-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') tryLogin();
  document.getElementById('login-error').textContent='';
});

async function boot(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('today-label').textContent = new Date().toLocaleDateString('es-GT',{weekday:'long', day:'numeric', month:'long'});
  await Promise.all([loadPrices(), loadClients()]);
  setView('dashboard');
}

if(sessionStorage.getItem('granja_auth')==='1'){ boot(); }

/* ============ DATA HELPERS ============ */
async function loadPrices(){
  const {data} = await sb.from('prices').select('*').order('tamano');
  state.prices = data || [];
}
async function loadClients(){
  const {data} = await sb.from('customers').select('*').order('nombre');
  state.clients = data || [];
}
function priceFor(tamano, unidad){
  const p = state.prices.find(p=>p.tamano===tamano);
  if(!p) return 0;
  if(unidad==='caja') return p.precio_caja;
  if(unidad==='unidad') return p.precio_unidad;
  return p.precio_carton;
}

function openPricesModal(){
  showModal(`
    <h2>Precios por tamaño</h2>
    ${SIZES.map(s=>{
      const p = state.prices.find(pr=>pr.tamano===s.v) || {};
      return `
      <div class="card" style="margin-bottom:12px;padding:14px;">
        <div style="font-weight:700;margin-bottom:10px;">${s.l}</div>
        <div class="row">
          <div>
            <label>Unidad (Q)</label>
            <input type="number" step="0.01" id="price-${s.v}-unidad" value="${p.precio_unidad ?? 0}">
          </div>
          <div>
            <label>Cartón (Q)</label>
            <input type="number" step="0.01" id="price-${s.v}-carton" value="${p.precio_carton ?? 0}">
          </div>
          <div>
            <label>Caja (Q)</label>
            <input type="number" step="0.01" id="price-${s.v}-caja" value="${p.precio_caja ?? 0}">
          </div>
        </div>
      </div>`;
    }).join('')}
    <button class="btn" onclick="savePrices(this)">Guardar precios</button>
  `);
}
async function savePrices(btn){
  await withSaving(btn, async ()=>{
    for(const s of SIZES){
      const precio_unidad = parseFloat(document.getElementById(`price-${s.v}-unidad`).value)||0;
      const precio_carton = parseFloat(document.getElementById(`price-${s.v}-carton`).value)||0;
      const precio_caja = parseFloat(document.getElementById(`price-${s.v}-caja`).value)||0;
      const {error} = await sb.from('prices').update({precio_unidad, precio_carton, precio_caja}).eq('tamano', s.v);
      if(error) throw error;
    }
    await loadPrices();
    closeModal();
    alert('Precios actualizados ✓');
  });
}

const TITLES = {dashboard:'Inicio', production:'Producción', sales:'Ventas', clients:'Clientes', expenses:'Gastos', analysis:'Análisis'};

let chartJsLoaded = false;
function loadChartJs(){
  return new Promise((resolve, reject)=>{
    if(chartJsLoaded && window.Chart){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js';
    s.onload = ()=>{ chartJsLoaded = true; resolve(); };
    s.onerror = ()=> reject(new Error('No se pudo cargar la librería de gráficos. Revisa tu conexión a internet.'));
    document.head.appendChild(s);
  });
}

async function setView(view){
  state.view = view;
  document.getElementById('page-title').textContent = TITLES[view];
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="empty">Cargando…</div>';
  if(view==='dashboard') await renderDashboard();
  else if(view==='production') await renderProduction();
  else if(view==='sales') await renderSales();
  else if(view==='clients') await renderClients();
  else if(view==='expenses') await renderExpenses();
  else if(view==='analysis') await renderAnalysis();
}

/* ============ DASHBOARD ============ */
let dashPeriod = 'today';
function periodRange(p){
  const now = new Date();
  let start;
  if(p==='today'){ start = todayISO(); }
  else if(p==='week'){ const d=new Date(now); d.setDate(d.getDate()-6); start=localISO(d); }
  else { const d=new Date(now); d.setDate(d.getDate()-29); start=localISO(d); }
  return {start, end: todayISO()};
}

async function renderDashboard(){
  const {start, end} = periodRange(dashPeriod);
  const [salesRes, expRes, paymentsInRangeRes, debtSalesRes, allPaymentsRes, todayProdRes] = await Promise.all([
    sb.from('sales').select('*').gte('fecha', start).lte('fecha', end),
    sb.from('expenses').select('*').gte('fecha', start).lte('fecha', end),
    sb.from('payments').select('monto').gte('fecha', start).lte('fecha', end),
    sb.from('sales').select('total, customer_id').eq('pagado', false),
    sb.from('payments').select('monto, customer_id'),
    sb.from('production').select('id').eq('fecha', todayISO()).limit(1)
  ]);
  const sales = salesRes.data || [];
  const expenses = expRes.data || [];
  const abonosPeriodo = (paymentsInRangeRes.data||[]).reduce((a,p)=>a+Number(p.monto),0);
  const ventasContado = sales.filter(s=>s.pagado).reduce((a,s)=>a+Number(s.total),0);
  const efectivo = ventasContado + abonosPeriodo;
  const totalGastos = expenses.reduce((a,e)=>a+Number(e.monto),0);
  const ganancia = efectivo - totalGastos;

  const debtBySales = {}; (debtSalesRes.data||[]).forEach(s=>{ debtBySales[s.customer_id]=(debtBySales[s.customer_id]||0)+Number(s.total); });
  const paidByCustomer = {}; (allPaymentsRes.data||[]).forEach(p=>{ paidByCustomer[p.customer_id]=(paidByCustomer[p.customer_id]||0)+Number(p.monto); });
  let totalPorCobrar = 0;
  Object.keys(debtBySales).forEach(cid=>{
    const bal = debtBySales[cid] - (paidByCustomer[cid]||0);
    if(bal>0) totalPorCobrar += bal;
  });

  const horaActual = new Date().getHours();
  const sinProduccionHoy = (todayProdRes.data||[]).length===0 && horaActual>=12;

  const main = document.getElementById('main-content');
  main.innerHTML = `
    ${sinProduccionHoy ? `
    <div class="card" style="background:#FDF3E0;border-color:var(--yolk);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <div style="font-size:13.5px;"><strong>🥚 Aún no registras producción hoy</strong><br><span style="color:var(--ink-soft);">No olvides anotarla antes de terminar el día.</span></div>
      <button class="btn" style="width:auto;padding:10px 16px;white-space:nowrap;" onclick="setView('production');openProductionModal()">Anotar</button>
    </div>` : ''}
    <div class="period-tabs">
      <button onclick="dashPeriod='today';renderDashboard()" class="${dashPeriod==='today'?'selected':''}">Hoy</button>
      <button onclick="dashPeriod='week';renderDashboard()" class="${dashPeriod==='week'?'selected':''}">7 días</button>
      <button onclick="dashPeriod='month';renderDashboard()" class="${dashPeriod==='month'?'selected':''}">30 días</button>
    </div>
    <div class="row" style="margin-bottom:12px;">
      <div class="stat pos"><div class="label">Efectivo (contado + abonos)</div><div class="value">${money(efectivo)}</div></div>
      <div class="stat"><div class="label">Gastos</div><div class="value">${money(totalGastos)}</div></div>
    </div>
    <div class="row" style="margin-bottom:4px;">
      <div class="stat ${ganancia>=0?'pos':'neg'}"><div class="label">Ganancia (efectivo)</div><div class="value">${money(ganancia)}</div></div>
      <div class="stat neg"><div class="label">Deuda total por cobrar</div><div class="value">${money(totalPorCobrar)}</div></div>
    </div>
    ${dashPeriod==='today' ? `<div class="empty" style="text-align:left;font-size:12px;padding:0 0 4px;">💡 El efectivo de "Hoy" es solo de hoy — mañana este número vuelve a empezar en Q0.00.</div>` : ''}

    <button class="btn secondary" style="margin:10px 0 16px;" onclick="openDailySummaryModal()">📋 Ver movimientos de hoy</button>

    <div class="section-title">Registro rápido</div>
    <div class="row">
      <button class="btn" onclick="setView('production');openProductionModal()">+ Producción</button>
      <button class="btn secondary" onclick="setView('sales');openSaleModal()">+ Venta</button>
    </div>
  `;
}

/* ============ RESUMEN DEL DÍA (para cuadrar caja) ============ */
async function openDailySummaryModal(){
  showModal(`<div id="daily-summary-body"><div class="empty">Cargando…</div></div>`);
  const today = todayISO();
  const [salesRes, paymentsRes, expensesRes] = await Promise.all([
    sb.from('sales').select('*, customers(nombre)').eq('fecha', today).order('created_at'),
    sb.from('payments').select('*, customers(nombre)').eq('fecha', today).order('created_at'),
    sb.from('expenses').select('*').eq('fecha', today).order('created_at')
  ]);
  const sales = salesRes.data || [];
  const payments = paymentsRes.data || [];
  const expenses = expensesRes.data || [];

  const events = [
    ...sales.map(s=>({type:'venta', created_at:s.created_at, ...s})),
    ...payments.map(p=>({type:'abono', created_at:p.created_at, ...p}))
  ].sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));

  const efectivoHoy = sales.filter(s=>s.pagado).reduce((a,s)=>a+Number(s.total),0) + payments.reduce((a,p)=>a+Number(p.monto),0);
  const creditoHoy = sales.filter(s=>!s.pagado).reduce((a,s)=>a+Number(s.total),0);
  const gastosHoy = expenses.reduce((a,e)=>a+Number(e.monto),0);

  const body = document.getElementById('daily-summary-body');
  body.innerHTML = `
    <h2>📋 Movimientos de hoy</h2>
    <div class="row" style="margin-bottom:14px;">
      <div class="stat pos"><div class="label">Efectivo hoy</div><div class="value">${money(efectivoHoy)}</div></div>
      <div class="stat"><div class="label">Gastos hoy</div><div class="value">${money(gastosHoy)}</div></div>
    </div>
    <div class="section-title">Ventas y abonos (${events.length})</div>
    <div class="card" style="margin-bottom:14px;max-height:300px;overflow-y:auto;">
      ${events.length===0 ? '<div class="empty">Todavía no hay ventas ni abonos hoy.</div>' :
        events.map(e=>`
        <div class="list-item">
          <div>
            <div><strong>${e.type==='venta'?'🧾 Venta':'💰 Abono'} · ${e.customers?e.customers.nombre:'(cliente eliminado)'}</strong></div>
            <div class="meta">${e.type==='venta' ? sizeLabel(e.tamano)+' · '+e.cantidad+' '+unidadLabel(e.unidad)+(e.pagado?' · Contado':' · Crédito') : 'Abono a cuenta'}</div>
          </div>
          <div class="amount" style="color:${e.type==='venta'&&!e.pagado?'var(--rust)':'var(--green)'}">${money(e.type==='venta'?e.total:e.monto)}</div>
        </div>`).join('')}
    </div>
    ${creditoHoy>0?`<div class="empty" style="text-align:left;font-size:12.5px;">⚠️ Además, hoy se vendió ${money(creditoHoy)} al crédito (no es efectivo, es deuda nueva).</div>`:''}

    <div class="section-title">Gastos de hoy (${expenses.length})</div>

/* ============ PRODUCCIÓN ============ */
async function renderProduction(){
  const [{data}, {data: todayData}] = await Promise.all([
    sb.from('production').select('*').order('fecha',{ascending:false}).order('created_at',{ascending:false}).limit(30),
    sb.from('production').select('*').eq('fecha', todayISO())
  ]);

  // Resumen del día
  const resumen = {}; SIZES.forEach(s=>resumen[s.v]={cartones:0, unidades:0, merma:0});
  (todayData||[]).forEach(p=>{
    if(!resumen[p.tamano]) resumen[p.tamano]={cartones:0,unidades:0,merma:0};
    resumen[p.tamano].cartones += Number(p.cartones||0);
    resumen[p.tamano].unidades += Number(p.unidades_sueltas||0);
    resumen[p.tamano].merma += Number(p.merma||0);
  });
  let totalCartones=0, totalUnidades=0, totalMerma=0, valorEstimado=0;
  SIZES.forEach(s=>{
    totalCartones += resumen[s.v].cartones;
    totalUnidades += resumen[s.v].unidades;
    totalMerma += resumen[s.v].merma;
    valorEstimado += resumen[s.v].cartones * priceFor(s.v,'carton') + resumen[s.v].unidades * priceFor(s.v,'unidad');
  });
  const hayProduccionHoy = totalCartones>0 || totalUnidades>0 || totalMerma>0;

  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="row" style="margin-bottom:16px;">
      <button class="btn" onclick="openProductionModal()">+ Registrar producción</button>
      <button class="btn secondary" onclick="openInventoryModal()">📦 Inventario General</button>
    </div>

    <div class="section-title">Resumen de hoy</div>
    <div class="card" style="margin-bottom:16px;">
      ${!hayProduccionHoy ? '<div class="empty">Aún no has registrado producción hoy.</div>' : `
        ${SIZES.filter(s=>resumen[s.v].cartones>0||resumen[s.v].unidades>0||resumen[s.v].merma>0).map(s=>`
          <div class="list-item">
            <div><strong>${s.l}</strong></div>
            <div class="meta" style="text-align:right;">
              ${resumen[s.v].cartones>0?resumen[s.v].cartones+' cartones · ':''}${resumen[s.v].unidades>0?resumen[s.v].unidades+' sueltos · ':''}${resumen[s.v].merma>0?'⚠️ '+resumen[s.v].merma+' picados':''}
            </div>
          </div>
        `).join('')}
        <div class="list-item" style="border-top:2px solid var(--border);margin-top:6px;padding-top:12px;">
          <div><strong>Valor estimado de venta</strong></div>
          <div class="amount" style="color:var(--green);">${money(valorEstimado)}</div>
        </div>
        ${totalMerma>0?`<div class="meta" style="margin-top:8px;color:var(--rust);">⚠️ Total de huevos picados hoy: ${totalMerma}</div>`:''}
      `}
    </div>

    <div class="section-title">Historial</div>
    <div class="card">
      ${(!data||data.length===0) ? '<div class="empty">Aún no hay registros de producción.</div>' :
        data.map(p=>`
        <div class="list-item">
          <div>
            <div><strong>${sizeLabel(p.tamano)}</strong></div>
            <div class="meta">${fmtDate(p.fecha)}${p.nota?' · '+p.nota:''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="text-align:right;">
              <div class="amount">${p.cartones||0} cart.${p.unidades_sueltas?' + '+p.unidades_sueltas+' sueltos':''}</div>
              ${p.merma>0?`<div class="meta" style="color:var(--rust);">⚠️ ${p.merma} picados</div>`:''}
            </div>
            <button class="del-x" onclick="deleteRow('production','${p.id}')">✕</button>
          </div>
        </div>`).join('')}
    </div>
  `;
}

function openProductionModal(){
  showModal(`
    <h2>Registrar producción</h2>
    <label>Fecha</label>
    <input type="date" id="pf-fecha" value="${todayISO()}">
    <label>Tamaño de huevo</label>
    <select id="pf-tamano" onchange="recalcProdValor()">${SIZES.map(s=>`<option value="${s.v}">${s.l}</option>`).join('')}</select>
    <div class="row">
      <div>
        <label>Cartones completos</label>
        <input type="number" id="pf-cartones" placeholder="0" min="0" step="1" value="0" oninput="recalcProdValor()">
      </div>
      <div>
        <label>Huevos sueltos (no completan cartón)</label>
        <input type="number" id="pf-unidades" placeholder="0" min="0" step="1" value="0" oninput="recalcProdValor()">
      </div>
    </div>
    <label>Huevos picados / merma (opcional)</label>
    <input type="number" id="pf-merma" placeholder="0" min="0" step="1" value="0">
    <div class="empty" style="text-align:left;background:var(--green-soft);border-radius:10px;padding:10px 12px;margin-bottom:14px;">
      Valor estimado de venta: <strong id="pf-valor-estimado" style="color:var(--green);">Q0.00</strong>
    </div>
    <label>Nota (opcional)</label>
    <input type="text" id="pf-nota" placeholder="Ej: menos producción por calor">
    <button class="btn" onclick="saveProduction(this)">Guardar</button>
  `);
  recalcProdValor();
}
function recalcProdValor(){
  const tamano = document.getElementById('pf-tamano').value;
  const cartones = parseFloat(document.getElementById('pf-cartones').value)||0;
  const unidades = parseFloat(document.getElementById('pf-unidades').value)||0;
  const valor = cartones*priceFor(tamano,'carton') + unidades*priceFor(tamano,'unidad');
  document.getElementById('pf-valor-estimado').textContent = money(valor);
}
async function saveProduction(btn){
  const fecha = document.getElementById('pf-fecha').value;
  const tamano = document.getElementById('pf-tamano').value;
  const cartones = parseFloat(document.getElementById('pf-cartones').value)||0;
  const unidades_sueltas = parseFloat(document.getElementById('pf-unidades').value)||0;
  const merma = parseFloat(document.getElementById('pf-merma').value)||0;
  const nota = document.getElementById('pf-nota').value;
  if(cartones===0 && unidades_sueltas===0 && merma===0){ alert('Escribe al menos una cantidad (cartones, sueltos o merma)'); return; }
  await withSaving(btn, async ()=>{
    const {data, error} = await sb.from('production').insert({fecha, tamano, cartones, unidades_sueltas, merma, nota}).select().single();
    if(error) throw error;
    // Inventario General: la producción suma huevos automáticamente (la merma no cuenta, no es vendible)
    const huevosProducidos = cartones*30 + unidades_sueltas;
    if(huevosProducidos>0){
      await sb.from('inventory_movements').insert({
        fecha, tipo:'produccion', huevos: huevosProducidos,
        ref_table:'production', ref_id: data.id
      });
    }
    closeModal();
    renderProduction();
  });
}

function openSaleModal(){
  showModal(`
    <h2>Registrar venta</h2>
    <label>Fecha</label>
    <input type="date" id="sf-fecha" value="${todayISO()}">
    <label>Cliente</label>
    <select id="sf-cliente" onchange="toggleNewClient()">
      <option value="" disabled selected>Selecciona un cliente…</option>
      ${state.clients.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}
      <option value="__new__">+ Nuevo cliente…</option>
    </select>
    <div id="sf-new-client-wrap" style="display:none;">
      <label>Nombre del nuevo cliente</label>
      <input type="text" id="sf-new-client" placeholder="Nombre">
    </div>
    <label>Tamaño de huevo</label>
    <select id="sf-tamano" onchange="recalcSale()">${SIZES.map(s=>`<option value="${s.v}">${s.l}</option>`).join('')}</select>
    <div class="toggle-group" id="sf-unidad-group">
      <button type="button" data-u="unidad" onclick="setUnidad('unidad')">Unidad</button>
      <button type="button" class="selected" data-u="carton" onclick="setUnidad('carton')">Cartón</button>
      <button type="button" data-u="caja" onclick="setUnidad('caja')">Caja (12 cartones)</button>
    </div>
    <label>Cantidad</label>
    <input type="number" id="sf-cantidad" value="1" min="0.5" step="0.5" oninput="recalcSale()">
    <label>Precio unitario (Q)</label>
    <input type="number" id="sf-precio" step="0.01" oninput="recalcTotal()">
    <label>Total (Q)</label>
    <input type="number" id="sf-total" step="0.01">
    <div class="toggle-group">
      <button type="button" class="selected" data-p="si" onclick="setPagado(true)">Pagó de una vez</button>
      <button type="button" data-p="no" onclick="setPagado(false)">Queda debiendo</button>
    </div>
    <button class="btn" onclick="saveSale(this)">Guardar venta</button>
  `);
  saleState.unidad = 'carton';
  saleState.pagado = true;
  recalcSale();
}
const saleState = {unidad:'carton', pagado:true};
function toggleNewClient(){
  const isNew = document.getElementById('sf-cliente').value === '__new__';
  document.getElementById('sf-new-client-wrap').style.display = isNew ? 'block' : 'none';
}
function setUnidad(u){
  saleState.unidad = u;
  document.querySelectorAll('#sf-unidad-group button').forEach(b=>b.classList.toggle('selected', b.dataset.u===u));
  recalcSale();
}
function setPagado(v){
  saleState.pagado = v;
  document.querySelectorAll('.toggle-group button[data-p]').forEach(b=>b.classList.toggle('selected', (b.dataset.p==='si')===v));
}
function recalcSale(){
  const tamano = document.getElementById('sf-tamano').value;
  const precio = priceFor(tamano, saleState.unidad);
  document.getElementById('sf-precio').value = precio;
  recalcTotal();
}
function recalcTotal(){
  const cant = parseFloat(document.getElementById('sf-cantidad').value)||0;
  const precio = parseFloat(document.getElementById('sf-precio').value)||0;
  document.getElementById('sf-total').value = (cant*precio).toFixed(2);
}
async function saveSale(btn){
  const fecha = document.getElementById('sf-fecha').value;
  let clienteSel = document.getElementById('sf-cliente').value;
  const tamano = document.getElementById('sf-tamano').value;
  const cantidad = parseFloat(document.getElementById('sf-cantidad').value);
  const precio_unitario = parseFloat(document.getElementById('sf-precio').value);
  const total = parseFloat(document.getElementById('sf-total').value);

  if(!clienteSel){ alert('⚠️ No seleccionaste ningún cliente. Elige uno antes de guardar.'); return; }
  if(clienteSel === '__new__'){
    const nombre = document.getElementById('sf-new-client').value.trim();
    if(!nombre){ alert('Escribe el nombre del nuevo cliente'); return; }
  }
  if(!cantidad){ alert('Escribe la cantidad'); return; }

  await withSaving(btn, async ()=>{
    if(clienteSel === '__new__'){
      const nombre = document.getElementById('sf-new-client').value.trim();
      const {data, error} = await sb.from('customers').insert({nombre}).select().single();
      if(error) throw error;
      clienteSel = data.id;
      await loadClients();
    }
    const {data, error} = await sb.from('sales').insert({
      fecha, customer_id: clienteSel, tamano, unidad: saleState.unidad,
      cantidad, precio_unitario, total, pagado: saleState.pagado
    }).select().single();
    if(error) throw error;
    // Inventario General: la venta resta huevos automáticamente. Esto NUNCA debe bloquear la venta,
    // que ya quedó guardada arriba — por eso va en su propio try/catch, en silencio si falla.
    try{
      const huevosVendidos = cantidad * (saleState.unidad==='caja'?360 : saleState.unidad==='carton'?30 : 1);
      await sb.from('inventory_movements').insert({
        fecha, tipo:'venta', huevos: -huevosVendidos,
        ref_table:'sales', ref_id: data.id
      });
    } catch(invErr){ console.error('Inventario no actualizado:', invErr); }
    closeModal();
    renderSales();
  });
}

/* ============ CLIENTES ============ */
let clientSearch = '';
let clientSearchFocused = false;
let debtThreshold = parseFloat(localStorage.getItem('granja_debt_threshold')) || 300;
function setDebtThreshold(v){
  debtThreshold = parseFloat(v)||0;
  localStorage.setItem('granja_debt_threshold', debtThreshold);
  renderClients();
}
// Estado del saldo de un cliente: debe (rojo), a favor / le sobró crédito (verde), o al día (verde neutro).
// Un saldo negativo puede pasar si se borra una venta que ya tenía abonos aplicados — es real, no un error,
// y debe mostrarse con claridad en vez de esconderse como "Al día".
function balanceInfo(balance){
  if(balance>0.001) return {text: money(balance)+' debe', color:'var(--rust)'};
  if(balance<-0.001) return {text: money(Math.abs(balance))+' a favor', color:'var(--green)'};
  return {text:'Al día', color:'var(--green)'};
}
async function renderClients(){
  const [{data: sales}, {data: payments}] = await Promise.all([
    sb.from('sales').select('customer_id, total, pagado'),
    sb.from('payments').select('customer_id, monto')
  ]);
  const debt = {}, paid = {};
  (sales||[]).forEach(s=>{ if(!s.pagado) debt[s.customer_id]=(debt[s.customer_id]||0)+Number(s.total); });
  (payments||[]).forEach(p=>{ paid[p.customer_id]=(paid[p.customer_id]||0)+Number(p.monto); });

  const term = clientSearch.trim().toLowerCase();
  const filtered = state.clients
    .map(c=>({...c, balance: (debt[c.id]||0)-(paid[c.id]||0)}))
    .filter(c => c.nombre.toLowerCase().includes(term))
    .sort((a,b)=>{
      const aAlto = a.balance>debtThreshold, bAlto = b.balance>debtThreshold;
      if(aAlto!==bAlto) return aAlto?-1:1;
      return a.nombre.localeCompare(b.nombre);
    });
  const countAlto = filtered.filter(c=>c.balance>debtThreshold).length;

  const main = document.getElementById('main-content');
  main.innerHTML = `
    <button class="btn" style="margin-bottom:12px;" onclick="openNewClientModal()">+ Nuevo cliente</button>
    <div style="position:relative;margin-bottom:10px;">
      <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);">🔍</span>
      <input type="text" id="client-search-input" placeholder="Buscar cliente por nombre…" value="${clientSearch}"
        style="padding-left:38px;margin-bottom:0;"
        oninput="clientSearch=this.value;renderClients();"
        onfocus="clientSearchFocused=true;" onblur="clientSearchFocused=false;">
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--ink-soft);">
      <span>⚠️ Avisar si debe más de</span>
      <input type="number" value="${debtThreshold}" onchange="setDebtThreshold(this.value)" style="width:80px;padding:8px;margin-bottom:0;font-size:13px;">
      <span>Q</span>
    </div>
    ${countAlto>0 ? `<div class="card" style="background:var(--rust-soft);border-color:var(--rust);margin-bottom:14px;padding:12px 16px;"><strong style="color:var(--rust);">⚠️ ${countAlto} cliente${countAlto>1?'s':''} con deuda alta</strong></div>` : ''}
    <div class="card">
      ${filtered.length===0 ? `<div class="empty">${state.clients.length===0?'Aún no hay clientes.':'No se encontró ningún cliente.'}</div>` :
        filtered.map(c=>{
          const balance = c.balance;
          const alto = balance>debtThreshold;
          const bi = balanceInfo(balance);
          return `
          <div class="list-item" style="cursor:pointer;${alto?'background:var(--rust-soft);margin:0 -18px;padding:13px 18px;':''}" onclick="openClientDetail('${c.id}')">
            <div>
              <div><strong>${alto?'⚠️ ':''}${c.nombre}</strong></div>
              ${c.telefono? `<div class="meta">${c.telefono}</div>`:''}
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              <div class="amount" style="color:${bi.color}">${bi.text}</div>
              <button onclick="event.stopPropagation();openPaymentModal('${c.id}','${c.nombre.replace(/'/g,"\\'")}')" style="background:var(--green);color:#fff;border:none;border-radius:20px;padding:9px 16px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(63,107,74,.25);">💰 Abonar</button>
            </div>
          </div>`;
        }).join('')}
    </div>
  `;
  if(clientSearchFocused){
    const el = document.getElementById('client-search-input');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}
function openNewClientModal(){
  showModal(`
    <h2>Nuevo cliente</h2>
    <label>Nombre</label>
    <input type="text" id="nc-nombre" placeholder="Nombre completo">
    <label>Teléfono (opcional)</label>
    <input type="text" id="nc-telefono" placeholder="Teléfono">

async function saveNewClient(btn){
  const nombre = document.getElementById('nc-nombre').value.trim();
  const telefono = document.getElementById('nc-telefono').value.trim();
  if(!nombre){ alert('Escribe el nombre'); return; }

function openPaymentModal(customerId, nombre, returnToDetail){
  showModal(`
    <h2>Abono de ${nombre}</h2>
    <label>Fecha</label>
    <input type="date" id="pay-fecha" value="${todayISO()}">

async function savePayment(btn, customerId, returnToDetail){
  const fecha = document.getElementById('pay-fecha').value;

/* ============ HISTORIAL DE CLIENTE ============ */
async function openClientDetail(customerId){
  const client = state.clients.find(c=>c.id===customerId);
  if(!client) return;

  showModal(`<div id="client-detail-body"><div class="empty">Cargando historial…</div></div>`);

  const [salesRes, paymentsRes] = await Promise.all([
    sb.from('sales').select('*').eq('customer_id', customerId).order('fecha').order('created_at'),
    sb.from('payments').select('*').eq('customer_id', customerId).order('fecha').order('created_at')
  ]);
  const sales = salesRes.data || [];
  const payments = paymentsRes.data || [];

  const events = [
    ...sales.map(s=>({type:'venta', fecha:s.fecha, created_at:s.created_at, ...s})),
    ...payments.map(p=>({type:'abono', fecha:p.fecha, created_at:p.created_at, ...p}))
  ].sort((a,b)=> a.fecha===b.fecha ? new Date(a.created_at)-new Date(b.created_at) : new Date(a.fecha)-new Date(b.fecha));

  let running = 0;
  const rows = events.map(e=>{
    if(e.type==='venta'){
      if(!e.pagado) running += Number(e.total);
      return {...e, runningBalance: running};
    } else {
      running -= Number(e.monto);
      return {...e, runningBalance: running};
    }
  });
  const balanceFinal = running;

  window.__clientDetailData = {client, rows, balanceFinal};

  const body = document.getElementById('client-detail-body');
  const bi = balanceInfo(balanceFinal);
  body.innerHTML = `
    <h2>${client.nombre}</h2>
    ${client.telefono?`<div class="meta" style="margin-bottom:10px;">${client.telefono}</div>`:''}
    <div class="stat ${balanceFinal>0.001?'neg':'pos'}" style="margin-bottom:14px;">
      <div class="label">Saldo actual</div>
      <div class="value">${bi.text}</div>
    </div>
    <div class="row" style="margin-bottom:16px;">
      <button onclick="closeModal();openPaymentModal('${client.id}','${client.nombre.replace(/'/g,"\\'")}',true)" style="background:var(--green);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;box-shadow:0 2px 6px rgba(63,107,74,.25);">💰 Abonar</button>
      <button class="btn ghost" onclick="downloadClientReport(this)">📄 Reporte</button>
    </div>
    <div class="section-title">Historial completo</div>
    <div class="card" style="max-height:340px;overflow-y:auto;">
      ${rows.length===0 ? '<div class="empty">Sin movimientos todavía.</div>' :
        rows.map(r=>`
        <div class="list-item">
          <div>
            <div><strong>${r.type==='venta' ? 'Compra' : 'Abono'}</strong></div>
            <div class="meta">${fmtDate(r.fecha)}${r.type==='venta' ? ' · '+sizeLabel(r.tamano)+' · '+r.cantidad+' '+unidadLabel(r.unidad)+(r.pagado?' · Pagó de una vez':' · Al crédito') : ''}</div>
          </div>
          <div style="text-align:right;">
            <div class="amount" style="color:${r.type==='venta'?(r.pagado?'var(--green)':'var(--rust)'):'var(--green)'}">
              ${r.type==='venta' ? money(r.total) : '− '+money(r.monto)}
            </div>
            <div class="meta">saldo: ${money(r.runningBalance)}</div>
          </div>
        </div>`).join('')}
    </div>
  `;
}

let html2canvasLoaded = false;
function loadHtml2Canvas(){
  return new Promise((resolve, reject)=>{
    if(html2canvasLoaded && window.html2canvas){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload = ()=>{ html2canvasLoaded = true; resolve(); };
    s.onerror = ()=> reject(new Error('No se pudo cargar el generador de imágenes. Revisa tu conexión a internet.'));
    document.head.appendChild(s);
  });
}

async function downloadClientReport(btn){
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Generando…';
  try{
    await loadHtml2Canvas();
    const {client, rows, balanceFinal} = window.__clientDetailData;

    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:420px;background:#FFFFFF;font-family:"Public Sans",system-ui,sans-serif;color:#2A2118;padding:24px;';
    wrap.innerHTML = `
      <div style="font-family:'Fraunces',serif;font-size:22px;font-weight:700;margin-bottom:2px;">🥚 Granja</div>
      <div style="font-size:13px;color:#6B5E4C;margin-bottom:18px;">Estado de cuenta · ${new Date().toLocaleDateString('es-GT',{day:'2-digit',month:'long',year:'numeric'})}</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:2px;">${client.nombre}</div>
      ${client.telefono?`<div style="font-size:13px;color:#6B5E4C;margin-bottom:14px;">${client.telefono}</div>`:'<div style="margin-bottom:14px;"></div>'}
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
        <thead>
          <tr style="border-bottom:2px solid #2A2118;">
            <th style="text-align:left;padding:6px 4px;">Fecha</th>
            <th style="text-align:left;padding:6px 4px;">Detalle</th>
            <th style="text-align:right;padding:6px 4px;">Monto</th>
            <th style="text-align:right;padding:6px 4px;">Saldo</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr style="border-bottom:1px solid #E5D9C2;">
              <td style="padding:6px 4px;">${fmtDate(r.fecha)}</td>
              <td style="padding:6px 4px;">${r.type==='venta' ? sizeLabel(r.tamano)+' · '+r.cantidad+' '+unidadLabel(r.unidad)+(r.pagado?' (contado)':' (crédito)') : 'Abono'}</td>
              <td style="padding:6px 4px;text-align:right;">${r.type==='venta' ? money(r.total) : '−'+money(r.monto)}</td>
              <td style="padding:6px 4px;text-align:right;">${money(r.runningBalance)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div style="margin-top:18px;padding:14px;background:${balanceFinal>0.001?'#FBEAE6':'#E7EFE7'};border-radius:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:700;">${balanceFinal>0.001?'Saldo pendiente':'Al día — sin saldo pendiente'}</span>
        <span style="font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:${balanceFinal>0.001?'#B3462F':'#3F6B4A'};">${balanceFinal>0.001?money(balanceFinal):''}</span>
      </div>
    `;
    document.body.appendChild(wrap);
    const canvas = await html2canvas(wrap, {backgroundColor:'#FFFFFF', scale:2});
    document.body.removeChild(wrap);

    const fileName = `estado_cuenta_${client.nombre.replace(/\s+/g,'_')}_${todayISO()}.png`;
    canvas.toBlob(async (blob)=>{
      const file = new File([blob], fileName, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:'Estado de cuenta', text:`Estado de cuenta de ${client.nombre}`});
          return;
        } catch(e){ /* si cancela compartir, seguimos con descarga */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch(err){
    console.error(err);
    alert('No se pudo generar el reporte.\n\nError: ' + (err && err.message || 'desconocido'));
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

// Unidad interna: huevo. 1 cartón = 30 huevos. No distingue tamaño ni precio, solo cantidad total.
function tipoInvLabel(t){ return {inicial:'Inventario inicial', produccion:'Producción', venta:'Venta', ajuste:'Ajuste'}[t] || t; }
function tipoInvIcon(t){ return {inicial:'🏁', produccion:'🥚', venta:'🧾', ajuste:'✏️'}[t] || '•'; }

function openInventoryModal(){
  showModal(`<div id="inv-body"><div class="empty">Cargando…</div></div>`);
  loadInventory();
}
async function loadInventory(){
  const body = document.getElementById('inv-body');
  const {data, error} = await sb.from('inventory_movements').select('*').order('fecha',{ascending:false}).order('created_at',{ascending:false});
  if(error){ body.innerHTML = `<div class="empty">Error cargando inventario: ${error.message}</div>`; return; }
  const movimientos = data || [];
  const stock = movimientos.reduce((a,m)=>a+Number(m.huevos),0);

  const cartonesStock = Math.floor(stock/30);
  const sueltosStock = stock - cartonesStock*30;
  const stockDisplay = stock>=0
    ? `${cartonesStock} cartones + ${sueltosStock} huevos sueltos`
    : `${stock} huevos`;

  body.innerHTML = `
    <h2>📦 Inventario General</h2>
    <div class="stat ${stock>=0?'pos':'neg'}" style="margin-bottom:16px;">
      <div class="label">Stock actual (en huevos)</div>
      <div class="value">${stock<0?'⚠️ ':''}${stockDisplay}</div>
      ${stock<0?'<div class="meta" style="color:var(--rust);margin-top:6px;">El inventario quedó negativo — probablemente falta registrar producción, o el inventario inicial no se cargó todavía.</div>':''}
    </div>
    <div class="row" style="margin-bottom:16px;">
      <button class="btn secondary" onclick="openInventoryInitialModal()">🏁 Inventario inicial</button>
      <button class="btn ghost" onclick="openInventoryAdjustModal()">✏️ Ajuste manual</button>
    </div>
    <div class="section-title">Historial de movimientos</div>
    <div class="card" style="max-height:320px;overflow-y:auto;">
      ${movimientos.length===0 ? '<div class="empty">Sin movimientos todavía.</div>' :
        movimientos.slice(0,60).map(m=>`
        <div class="list-item">
          <div>
            <div><strong>${tipoInvIcon(m.tipo)} ${tipoInvLabel(m.tipo)}</strong></div>
            <div class="meta">${fmtDate(m.fecha)}${m.motivo?' · '+m.motivo:''}</div>
          </div>
          <div class="amount" style="color:${Number(m.huevos)>=0?'var(--green)':'var(--rust)'}">${Number(m.huevos)>=0?'+':''}${m.huevos} huevos</div>
        </div>`).join('')}
    </div>
  `;
}

}
async function saveInventoryAdjust(btn){
  const cartones = parseFloat(document.getElementById('inv-a-cartones').value)||0;
  const sueltos = parseFloat(document.getElementById('inv-a-sueltos').value)||0;
  const fecha = document.getElementById('inv-a-fecha').value;
  const motivo = document.getElementById('inv-a-motivo').value.trim();
  const cantidad = cartones*30 + sueltos;
  if(cantidad===0){ alert('Escribe alguna cantidad'); return; }
  if(!motivo){ alert('Escribe el motivo del ajuste'); return; }
  const huevos = cantidad * invAdjustSign;
  await withSaving(btn, async ()=>{
    const {error} = await sb.from('inventory_movements').insert({fecha, tipo:'ajuste', huevos, motivo});
    if(error) throw error;
    closeModal();
    openInventoryModal();
  });
}

/* ============ ANÁLISIS ============ */
let analysisPeriod = 30;
let analysisCharts = {};

function destroyCharts(){
  Object.values(analysisCharts).forEach(c=>{ if(c) c.destroy(); });
  analysisCharts = {};
}

async function renderAnalysis(){
  const main = document.getElementById('main-content');
  try{
    await loadChartJs();
  } catch(err){
    main.innerHTML = `<div class="empty">${err.message}</div>`;
    return;
  }

  const now = new Date();
  const start = new Date(now); start.setDate(start.getDate() - (analysisPeriod - 1));
  const startISO = localISO(start);
  const endISO = todayISO();

  const [salesRes, expRes, paymentsRes, debtSalesRes, allPaymentsRes, prodRes] = await Promise.all([
    sb.from('sales').select('fecha, tamano, total, pagado, unidad, cantidad').gte('fecha', startISO).lte('fecha', endISO),
    sb.from('expenses').select('fecha, categoria, monto').gte('fecha', startISO).lte('fecha', endISO),
    sb.from('payments').select('fecha, monto').gte('fecha', startISO).lte('fecha', endISO),
    sb.from('sales').select('total, customer_id').eq('pagado', false),
    sb.from('payments').select('monto, customer_id'),
    sb.from('production').select('*').gte('fecha', startISO).lte('fecha', endISO)
  ]);
  const sales = salesRes.data || [];
  const expenses = expRes.data || [];
  const payments = paymentsRes.data || [];
  const production = prodRes.data || [];

  // Construir serie de días (fecha LOCAL, no UTC)
  const days = [];
  for(let d = new Date(start); localISO(d) <= endISO; d.setDate(d.getDate()+1)){
    days.push(localISO(d));
  }

  const efectivoPorDia = {}; days.forEach(d=>efectivoPorDia[d]=0);
  sales.forEach(s=>{ if(s.pagado && efectivoPorDia[s.fecha]!==undefined) efectivoPorDia[s.fecha]+=Number(s.total); });
  payments.forEach(p=>{ if(efectivoPorDia[p.fecha]!==undefined) efectivoPorDia[p.fecha]+=Number(p.monto); });

  const gastosPorDia = {}; days.forEach(d=>gastosPorDia[d]=0);
  expenses.forEach(e=>{ if(gastosPorDia[e.fecha]!==undefined) gastosPorDia[e.fecha]+=Number(e.monto); });

  const ventasPorTamano = {}; SIZES.forEach(s=>ventasPorTamano[s.v]=0);
  sales.forEach(s=>{ ventasPorTamano[s.tamano]=(ventasPorTamano[s.tamano]||0)+Number(s.total); });

  const gastosPorCategoria = {};
  expenses.forEach(e=>{ gastosPorCategoria[e.categoria]=(gastosPorCategoria[e.categoria]||0)+Number(e.monto); });

  const totalVentas = sales.reduce((a,s)=>a+Number(s.total),0);
  const totalGastos = expenses.reduce((a,e)=>a+Number(e.monto),0);
  const totalEfectivo = days.reduce((a,d)=>a+efectivoPorDia[d],0);
  const gananciaEfectivo = totalEfectivo - totalGastos;

  // Margen de ganancia real: costo estimado por cartón producido vs precio promedio al que se vende
  const totalCartonesProducidos = production.reduce((a,p)=>a+Number(p.cartones||0),0);
  const costoPorCarton = totalCartonesProducidos>0 ? totalGastos/totalCartonesProducidos : null;
  const ventasCarton = sales.filter(s=>s.unidad==='carton');
  const totalCartonesVendidos = ventasCarton.reduce((a,s)=>a+Number(s.cantidad),0);
  const totalQCartonesVendidos = ventasCarton.reduce((a,s)=>a+Number(s.total),0);
  const precioPromedioCarton = totalCartonesVendidos>0 ? totalQCartonesVendidos/totalCartonesVendidos : null;
  const margenPorCarton = (costoPorCarton!==null && precioPromedioCarton!==null) ? precioPromedioCarton-costoPorCarton : null;
  const margenPorcentaje = totalEfectivo>0 ? (gananciaEfectivo/totalEfectivo*100) : null;

  // Deuda total actual (a hoy, no depende del periodo — es el saldo pendiente de todos los clientes)
  const debtBySales = {}; (debtSalesRes.data||[]).forEach(s=>{ debtBySales[s.customer_id]=(debtBySales[s.customer_id]||0)+Number(s.total); });
  const paidByCustomer = {}; (allPaymentsRes.data||[]).forEach(p=>{ paidByCustomer[p.customer_id]=(paidByCustomer[p.customer_id]||0)+Number(p.monto); });
  let deudaTotal = 0;
  Object.keys(debtBySales).forEach(cid=>{
    const bal = debtBySales[cid] - (paidByCustomer[cid]||0);
    if(bal>0) deudaTotal += bal;
  });

  const dayLabels = days.map(d=>fmtDate(d));
  const gananciaPorDia = days.map(d=>efectivoPorDia[d]-gastosPorDia[d]);

  main.innerHTML = `
    <div class="period-tabs">
      <button onclick="analysisPeriod=7;renderAnalysis()" class="${analysisPeriod===7?'selected':''}">7 días</button>
      <button onclick="analysisPeriod=30;renderAnalysis()" class="${analysisPeriod===30?'selected':''}">30 días</button>
      <button onclick="analysisPeriod=90;renderAnalysis()" class="${analysisPeriod===90?'selected':''}">90 días</button>
    </div>
    <div class="row" style="margin-bottom:10px;">
      <div class="stat pos"><div class="label">Efectivo (contado + abonos)</div><div class="value">${money(totalEfectivo)}</div></div>
      <div class="stat neg"><div class="label">Deuda total (por cobrar)</div><div class="value">${money(deudaTotal)}</div></div>
    </div>
    <div class="row" style="margin-bottom:14px;">
      <div class="stat"><div class="label">Gastos del periodo</div><div class="value">${money(totalGastos)}</div></div>
      <div class="stat ${gananciaEfectivo>=0?'pos':'neg'}"><div class="label">Ganancia (efectivo)</div><div class="value">${money(gananciaEfectivo)}</div></div>
    </div>
    <div class="empty" style="text-align:left;font-size:12.5px;padding:0 0 16px;">💡 <strong>Efectivo</strong> = ventas al contado + abonos recibidos en el periodo. <strong>Deuda</strong> = todo lo que los clientes deben hoy (no cambia por periodo). <strong>Ganancia</strong> = efectivo − gastos.</div>

    <div class="section-title">Margen de ganancia real</div>
    <div class="card" style="margin-bottom:16px;">
      ${margenPorcentaje!==null ? `<div class="list-item"><div>De cada Q1 que entra en efectivo</div><div class="amount" style="color:${margenPorcentaje>=0?'var(--green)':'var(--rust)'}">${margenPorcentaje.toFixed(0)}% es ganancia</div></div>` : ''}
      ${costoPorCarton!==null ? `<div class="list-item"><div>Costo estimado por cartón producido</div><div class="amount">${money(costoPorCarton)}</div></div>` : '<div class="empty" style="padding:8px 0;">Registra producción en este periodo para ver el costo por cartón.</div>'}
      ${precioPromedioCarton!==null ? `<div class="list-item"><div>Precio promedio al que vendes el cartón</div><div class="amount">${money(precioPromedioCarton)}</div></div>` : ''}
      ${margenPorCarton!==null ? `<div class="list-item"><div><strong>Ganancia estimada por cartón</strong></div><div class="amount" style="color:${margenPorCarton>=0?'var(--green)':'var(--rust)'}">${money(margenPorCarton)}</div></div>` : ''}
      <div class="empty" style="text-align:left;font-size:11.5px;padding-top:6px;">*Costo por cartón = todos los gastos del periodo ÷ cartones producidos. Es un estimado general, no separa gastos por tamaño de huevo.</div>
    </div>

    <button class="btn secondary" style="margin-bottom:16px;" onclick="openMonthlySummaryModal()">📅 Ver resumen mensual</button>

    <div class="section-title">Efectivo por día</div>
    <div class="card"><canvas id="chart-ventas-dia" height="180"></canvas></div>

    <div class="section-title">Ganancia por día</div>
    <div class="card"><canvas id="chart-ganancia-dia" height="180"></canvas></div>

    <div class="section-title">Ventas por tamaño de huevo (contado + crédito)</div>
    <div class="card">${totalVentas>0 ? '<canvas id="chart-tamano" height="200"></canvas>' : '<div class="empty">Sin ventas en este periodo.</div>'}</div>

    <div class="section-title">Gastos por categoría</div>
    <div class="card">${Object.keys(gastosPorCategoria).length>0 ? '<canvas id="chart-gastos-cat" height="200"></canvas>' : '<div class="empty">Sin gastos en este periodo.</div>'}</div>
  `;

  destroyCharts();
  const inkSoft = '#6B5E4C';
  Chart.defaults.font.family = "'Public Sans', system-ui, sans-serif";
  Chart.defaults.color = inkSoft;

  analysisCharts.ventasDia = new Chart(document.getElementById('chart-ventas-dia'), {
    type:'line',
    data:{ labels: dayLabels, datasets:[{ label:'Efectivo (Q)', data: days.map(d=>efectivoPorDia[d]), borderColor:'#E3A73A', backgroundColor:'rgba(227,167,58,.18)', fill:true, tension:.3, pointRadius: analysisPeriod>30?0:3 }] },
    options:{ plugins:{legend:{display:false}}, scales:{ x:{ ticks:{ maxTicksLimit:8 }, grid:{display:false} }, y:{ beginAtZero:true } } }
  });

  analysisCharts.gananciaDia = new Chart(document.getElementById('chart-ganancia-dia'), {
    type:'bar',
    data:{ labels: dayLabels, datasets:[{ label:'Ganancia (Q)', data: gananciaPorDia, backgroundColor: gananciaPorDia.map(v=> v>=0 ? '#3F6B4A' : '#B3462F') }] },
    options:{ plugins:{legend:{display:false}}, scales:{ x:{ ticks:{ maxTicksLimit:8 }, grid:{display:false} }, y:{ beginAtZero:true } } }
  });

  if(totalVentas>0){
    analysisCharts.tamano = new Chart(document.getElementById('chart-tamano'), {
      type:'bar',
      data:{ labels: SIZES.map(s=>s.l), datasets:[{ label:'Ventas (Q)', data: SIZES.map(s=>ventasPorTamano[s.v]), backgroundColor:'#3F6B4A', borderRadius:6 }] },
      options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{ x:{ beginAtZero:true } } }
    });
  }

  const catLabels = Object.keys(gastosPorCategoria);
  if(catLabels.length>0){
    analysisCharts.gastosCat = new Chart(document.getElementById('chart-gastos-cat'), {
      type:'bar',
      data:{ labels: catLabels, datasets:[{ label:'Gastos (Q)', data: catLabels.map(c=>gastosPorCategoria[c]), backgroundColor:'#B3462F', borderRadius:6 }] },
      options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{ x:{ beginAtZero:true } } }
    });
  }
}

/* ============ RESUMEN MENSUAL ============ */
function currentMonthValue(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function openMonthlySummaryModal(){
  showModal(`
    <h2>Resumen mensual</h2>
    <label>Mes</label>
    <input type="month" id="ms-mes" value="${currentMonthValue()}" onchange="loadMonthlySummary()">
    <div id="ms-body"><div class="empty">Cargando…</div></div>
  `);
  loadMonthlySummary();
}
async function loadMonthlySummary(){
  const body = document.getElementById('ms-body');
  body.innerHTML = '<div class="empty">Cargando…</div>';
  const monthVal = document.getElementById('ms-mes').value; // "2026-08"
  const [y,m] = monthVal.split('-').map(Number);
  const startISO = `${monthVal}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const todayStr = todayISO();
  const naturalEnd = `${monthVal}-${String(lastDay).padStart(2,'0')}`;
  const endISO = naturalEnd < todayStr ? naturalEnd : todayStr; // no mostrar días futuros del mes actual

  const [salesRes, expRes, paymentsRes, prodRes, debtSalesAllRes, paymentsAllRes] = await Promise.all([
    sb.from('sales').select('*').gte('fecha', startISO).lte('fecha', endISO),
    sb.from('expenses').select('*').gte('fecha', startISO).lte('fecha', endISO),
    sb.from('payments').select('*').gte('fecha', startISO).lte('fecha', endISO),
    sb.from('production').select('*').gte('fecha', startISO).lte('fecha', endISO),
    sb.from('sales').select('total, customer_id').eq('pagado', false).lte('fecha', endISO),
    sb.from('payments').select('monto, customer_id').lte('fecha', endISO)
  ]);
  const sales = salesRes.data || [];
  const expenses = expRes.data || [];
  const payments = paymentsRes.data || [];
  const production = prodRes.data || [];

  const ventasContado = sales.filter(s=>s.pagado).reduce((a,s)=>a+Number(s.total),0);
  const ventasCredito = sales.filter(s=>!s.pagado).reduce((a,s)=>a+Number(s.total),0);
  const abonos = payments.reduce((a,p)=>a+Number(p.monto),0);
  const efectivo = ventasContado + abonos;
  const totalGastos = expenses.reduce((a,e)=>a+Number(e.monto),0);
  const ganancia = efectivo - totalGastos;

  const prodPorTamano = {}; SIZES.forEach(s=>prodPorTamano[s.v]={cartones:0,unidades:0,merma:0});
  production.forEach(p=>{
    if(!prodPorTamano[p.tamano]) prodPorTamano[p.tamano]={cartones:0,unidades:0,merma:0};
    prodPorTamano[p.tamano].cartones += Number(p.cartones||0);
    prodPorTamano[p.tamano].unidades += Number(p.unidades_sueltas||0);
    prodPorTamano[p.tamano].merma += Number(p.merma||0);
  });

  // Deuda al cierre del mes (histórica: solo movimientos hasta endISO)
  const debtBySales = {}; (debtSalesAllRes.data||[]).forEach(s=>{ debtBySales[s.customer_id]=(debtBySales[s.customer_id]||0)+Number(s.total); });
  const paidByCustomer = {}; (paymentsAllRes.data||[]).forEach(p=>{ paidByCustomer[p.customer_id]=(paidByCustomer[p.customer_id]||0)+Number(p.monto); });
  let deudaAlCierre = 0;
  Object.keys(debtBySales).forEach(cid=>{ const bal=debtBySales[cid]-(paidByCustomer[cid]||0); if(bal>0) deudaAlCierre+=bal; });

  const monthName = new Date(y, m-1, 1).toLocaleDateString('es-GT', {month:'long', year:'numeric'});
  window.__monthlySummaryData = {monthName, ventasContado, ventasCredito, abonos, efectivo, totalGastos, ganancia, prodPorTamano, deudaAlCierre};

  const bodyEl = document.getElementById('ms-body');
  bodyEl.innerHTML = `
    <div class="section-title" style="margin-top:6px;">Producción del mes</div>
    <div class="card" style="margin-bottom:14px;">
      ${SIZES.filter(s=>prodPorTamano[s.v].cartones>0||prodPorTamano[s.v].unidades>0).map(s=>`
        <div class="list-item"><div>${s.l}</div><div class="meta">${prodPorTamano[s.v].cartones} cartones${prodPorTamano[s.v].unidades?' + '+prodPorTamano[s.v].unidades+' sueltos':''}${prodPorTamano[s.v].merma?' · ⚠️ '+prodPorTamano[s.v].merma+' picados':''}</div></div>
      `).join('') || '<div class="empty">Sin producción registrada.</div>'}
    </div>
    <div class="section-title">Dinero del mes</div>
    <div class="card">
      <div class="list-item"><div>Ventas al contado</div><div class="amount">${money(ventasContado)}</div></div>
      <div class="list-item"><div>Ventas al crédito (fiado)</div><div class="amount">${money(ventasCredito)}</div></div>
      <div class="list-item"><div>Abonos recibidos</div><div class="amount">${money(abonos)}</div></div>
      <div class="list-item"><div><strong>Efectivo total</strong></div><div class="amount" style="color:var(--green);">${money(efectivo)}</div></div>
      <div class="list-item"><div>Gastos</div><div class="amount">${money(totalGastos)}</div></div>
      <div class="list-item"><div><strong>Ganancia</strong></div><div class="amount" style="color:${ganancia>=0?'var(--green)':'var(--rust)'}">${money(ganancia)}</div></div>
      <div class="list-item"><div>Deuda pendiente al cierre</div><div class="amount" style="color:var(--rust);">${money(deudaAlCierre)}</div></div>
    </div>
    <button class="btn" style="margin-top:16px;" onclick="downloadMonthlySummary(this)">📥 Descargar resumen (imagen)</button>
  `;
}
async function downloadMonthlySummary(btn){
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = 'Generando…';
  try{
    await loadHtml2Canvas();
    const d = window.__monthlySummaryData;
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;left:-9999px;top:0;width:420px;background:#FFFFFF;font-family:"Public Sans",system-ui,sans-serif;color:#2A2118;padding:24px;';
    wrap.innerHTML = `
      <div style="font-family:'Fraunces',serif;font-size:22px;font-weight:700;margin-bottom:2px;">🥚 Granja</div>
      <div style="font-size:16px;font-weight:700;text-transform:capitalize;margin-bottom:18px;">Resumen de ${d.monthName}</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <tr style="border-bottom:1px solid #E5D9C2;"><td style="padding:7px 4px;">Ventas al contado</td><td style="padding:7px 4px;text-align:right;">${money(d.ventasContado)}</td></tr>
        <tr style="border-bottom:1px solid #E5D9C2;"><td style="padding:7px 4px;">Ventas al crédito</td><td style="padding:7px 4px;text-align:right;">${money(d.ventasCredito)}</td></tr>
        <tr style="border-bottom:1px solid #E5D9C2;"><td style="padding:7px 4px;">Abonos recibidos</td><td style="padding:7px 4px;text-align:right;">${money(d.abonos)}</td></tr>
        <tr style="border-bottom:2px solid #2A2118;"><td style="padding:7px 4px;font-weight:700;">Efectivo total</td><td style="padding:7px 4px;text-align:right;font-weight:700;">${money(d.efectivo)}</td></tr>
        <tr style="border-bottom:1px solid #E5D9C2;"><td style="padding:7px 4px;">Gastos</td><td style="padding:7px 4px;text-align:right;">${money(d.totalGastos)}</td></tr>
      </table>
      <div style="margin-top:14px;padding:14px;background:${d.ganancia>=0?'#E7EFE7':'#FBEAE6'};border-radius:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:700;">Ganancia del mes</span>
        <span style="font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:${d.ganancia>=0?'#3F6B4A':'#B3462F'};">${money(d.ganancia)}</span>
      </div>
      <div style="margin-top:10px;padding:14px;background:#FBEAE6;border-radius:10px;display:flex;justify-content:space-between;align-items:center;">
        <span style="font-weight:700;">Deuda pendiente al cierre</span>
        <span style="font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:#B3462F;">${money(d.deudaAlCierre)}</span>
      </div>
    `;
    document.body.appendChild(wrap);
    const canvas = await html2canvas(wrap, {backgroundColor:'#FFFFFF', scale:2});
    document.body.removeChild(wrap);
    const fileName = `resumen_${d.monthName.replace(/\s+/g,'_')}.png`;
    canvas.toBlob((blob)=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  } catch(err){
    console.error(err);
    alert('No se pudo generar el resumen.\n\nError: ' + (err && err.message || 'desconocido'));
  } finally {
    btn.disabled = false; btn.textContent = original;
  }
}

/* ============ RESPALDO / EXPORTAR ============ */
let xlsxLoaded = false;
function loadXLSX(){
  return new Promise((resolve, reject)=>{
    if(xlsxLoaded && window.XLSX){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = ()=>{ xlsxLoaded = true; resolve(); };
    s.onerror = ()=> reject(new Error('No se pudo cargar el generador de Excel. Revisa tu conexión a internet.'));
    document.head.appendChild(s);
  });
}

async function downloadBackup(btn){
  const original = btn ? btn.textContent : null;
  if(btn){ btn.disabled = true; btn.textContent = '⏳'; }
  try{
    await loadXLSX();

    const [production, sales, clients, payments, expenses, prices] = await Promise.all([
      sb.from('production').select('fecha, tamano, cartones, nota').order('fecha'),
      sb.from('sales').select('fecha, tamano, unidad, cantidad, precio_unitario, total, pagado, customers(nombre)').order('fecha'),
      sb.from('customers').select('nombre, telefono').order('nombre'),
      sb.from('payments').select('fecha, monto, customers(nombre)').order('fecha'),
      sb.from('expenses').select('fecha, categoria, descripcion, monto').order('fecha'),
      sb.from('prices').select('tamano, precio_unidad, precio_carton, precio_caja')
    ]);

    const wb = XLSX.utils.book_new();

    const prodRows = (production.data||[]).map(p=>({Fecha:p.fecha, Tamaño:sizeLabel(p.tamano), Cartones:p.cartones, Nota:p.nota||''}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(prodRows), 'Producción');

    const saleRows = (sales.data||[]).map(s=>({
      Fecha:s.fecha, Cliente: s.customers?s.customers.nombre:'(eliminado)', Tamaño:sizeLabel(s.tamano),
      Unidad: unidadLabel(s.unidad), Cantidad:s.cantidad, 'Precio unitario':s.precio_unitario,
      Total:s.total, Estado: s.pagado?'Pagado':'Debe'
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(saleRows), 'Ventas');

    const clientRows = (clients.data||[]).map(c=>({Nombre:c.nombre, Teléfono:c.telefono||''}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clientRows), 'Clientes');

    const paymentRows = (payments.data||[]).map(p=>({Fecha:p.fecha, Cliente: p.customers?p.customers.nombre:'(eliminado)', Monto:p.monto}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(paymentRows), 'Abonos');

    const expenseRows = (expenses.data||[]).map(e=>({Fecha:e.fecha, Categoría:e.categoria, Descripción:e.descripcion||'', Monto:e.monto}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenseRows), 'Gastos');

    const priceRows = (prices.data||[]).map(p=>({Tamaño:sizeLabel(p.tamano), 'Precio unidad':p.precio_unidad, 'Precio cartón':p.precio_carton, 'Precio caja':p.precio_caja}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(priceRows), 'Precios');

    XLSX.writeFile(wb, `respaldo_granja_${todayISO()}.xlsx`);
  } catch(err){
    console.error(err);
    alert('No se pudo generar el respaldo.\n\nError: ' + (err && err.message || 'desconocido'));
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = original; }
  }
}

/* ============ UTILIDADES ============ */
async function deleteRow(table, id){
  if(!confirm('¿Eliminar este registro?')) return;
  const {error} = await sb.from(table).delete().eq('id', id);
  if(error){ alert('No se pudo eliminar: ' + error.message); return; }
  // Si era producción o venta, borramos también su movimiento de Inventario General para que el stock no quede desfasado
  if(table==='production' || table==='sales'){
    try{ await sb.from('inventory_movements').delete().eq('ref_table', table).eq('ref_id', id); }
    catch(e){ console.error('No se pudo limpiar el movimiento de inventario:', e); }
  }
  setView(state.view);
}
function showModal(html){
  const bg = document.createElement('div');
  bg.className='modal-bg';
  bg.id='modal-bg';
  bg.onclick = (e)=>{ if(e.target.id==='modal-bg') closeModal(); };
  bg.innerHTML = `<div class="modal" style="position:relative;"><button class="modal-close" onclick="closeModal()">✕</button>${html}</div>`;
  document.body.appendChild(bg);
}
function closeModal(){
  const m = document.getElementById('modal-bg');
  if(m) m.remove();
}
